name: Deploy website to GitHub Pages

on:
  push:
    branches: [ "update" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  compile-cv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Compile CV
      uses: xu-cheng/latex-action@v4
      with:
        root_file: resume.tex
        working_directory: src/tex
        latexmk_use_xelatex: true
        # Keep CI typography identical to the local TeX Live 2023/Debian build.
        # The digest prevents package/font metric changes from shifting layout.
        docker_image: ghcr.io/xu-cheng/texlive-historic-debian@sha256:08c944043a03e4b2575ab806d9602312712048178f35abb6174739a33f2bc956
    - name: Upload compiled CV
      uses: actions/upload-artifact@v7
      with:
        name: compiled-cv
        path: src/tex/resume.pdf
        if-no-files-found: error
        retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: compile-cv
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Download compiled CV
      uses: actions/download-artifact@v8
      with:
        name: compiled-cv
        path: static/uploads
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v4
    - name: Build Astro site and search index
      run: npm run build
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
